default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.8.0
    hooks:
      - id: clang-tidy
        # --all-lines: report every diagnostic of a file, not only those on changed lines
        # --jobs: one clang-tidy process per file (and in parallel). Without it the hook passes every
        #   file to a single process, which ctcache (the result cache of the lint CI job, see
        #   tools/lint-clang-tidy.sh) could only key on its first file.
        args: [--version=23.1.3, --compile-commands=build/dev/host, --all-lines, --jobs=4]
        files: \.cpp$
        # the out-of-tree consumer project is not part of the main compile database, and neither is
        # the Boost.JSON comparison (built only with the `benchmarks` vcpkg feature, kept out of dev)
        exclude: ^(tests/package/|benchmarks/json_bench\.cpp$)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        # the ready-made entry is the untagged image; pin the released tag
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
  - repo: local
    hooks:
      - id: dclint
        name: dclint
        description: Lint compose.yaml with zavoloklom/docker-compose-linter (no pre-commit hook upstream)
        entry: zavoloklom/dclint:3.1.0
        language: docker_image
        files: ^compose\.ya?ml$
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
