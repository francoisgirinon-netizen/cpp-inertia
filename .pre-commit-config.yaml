default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.8.0
    hooks:
      - id: clang-tidy
        # --all-lines: report every diagnostic of a file, not only those on changed lines
        args: [--version=23.1.3, --compile-commands=build/dev/host, --all-lines]
        files: \.cpp$
        # the out-of-tree consumer project is not part of the main compile database
        exclude: ^tests/package/
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        # the ready-made entry is the untagged image; pin the released tag
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
  - repo: local
    hooks:
      - id: dclint
        name: dclint
        description: Lint compose.yaml with zavoloklom/docker-compose-linter (no pre-commit hook upstream)
        entry: zavoloklom/dclint:3.1.0
        language: docker_image
        files: ^compose\.ya?ml$
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
