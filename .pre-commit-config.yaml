repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: scripts/dev tools/run-clang-tidy.sh
        language: system
        files: \.cpp$
        # the out-of-tree consumer project is not part of the main compile database
        exclude: ^tests/package/
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
