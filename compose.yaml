# Single isolated dev environment: clang 23 (mise), cmake, ninja, vcpkg, bun, Playwright.
# Everything runs through scripts/dev, which exports UID/GID and calls `docker compose run --rm dev …`.
# Ports are only published with `docker compose run --service-ports` (or `docker compose up dev`),
# so one-shot commands (hooks, builds) never clash with a running dev server.
x-dev-base: &dev-base
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  # Per-worktree tag (INERTIA_IMAGE_TAG) so parallel checkouts never overwrite each other's image.
  image: cpp-inertia-dev:${INERTIA_IMAGE_TAG:-latest}
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /src
  init: true
  stdin_open: true
  tty: true
  command: ["bash"]
  environment:
    VCPKG_DEFAULT_BINARY_CACHE: /home/dev/.cache/vcpkg/archives
    BUN_INSTALL_CACHE_DIR: /home/dev/.bun/install/cache
    # Compiler cache (CMake launches every compile through it, see the base configure preset).
    # Locally it lives in the sccache-cache volume; CI sets SCCACHE_GHA_ENABLED instead.
    SCCACHE_DIR: /home/dev/.cache/sccache
    SCCACHE_CACHE_SIZE: 10G
    SCCACHE_GHA_ENABLED: ${SCCACHE_GHA_ENABLED:-}
    ACTIONS_RESULTS_URL: ${ACTIONS_RESULTS_URL:-}
    ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:-}
    INERTIA_TEST_PORT: "18080"
    # Forwarded from the host (`INERTIA_SSR=1 scripts/dev ...`); empty means off.
    INERTIA_SSR: ${INERTIA_SSR:-}
  volumes:
    - .:/src
    # VCPKG_CACHE_DIR (CI) turns the named volume into a host directory the cache action persists.
    - ${VCPKG_CACHE_DIR:-vcpkg-cache}:/home/dev/.cache/vcpkg
    - bun-cache:/home/dev/.bun/install/cache
    - ${SCCACHE_CACHE_DIR:-sccache-cache}:/home/dev/.cache/sccache

name: cpp-inertia

services:
  dev:
    # Loopback only: the dev servers are not reachable from the network.
    ports:
      - '127.0.0.1:5173:5173'   # Vite dev server (listens on 0.0.0.0 inside the container)
      - '127.0.0.1:8081:8081'   # Drogon example server
      - '127.0.0.1:13714:13714' # Inertia SSR server
    <<: *dev-base

  # Only for the tsan preset (scripts/dev-tsan). ThreadSanitizer re-executes itself with ASLR
  # disabled (personality(ADDR_NO_RANDOMIZE)), which Docker's default seccomp profile forbids. The
  # relaxed profile is confined to this service: dev keeps the default one. No published ports.
  tsan:
    <<: *dev-base
    security_opt:
      - seccomp=unconfined

volumes:
  vcpkg-cache:
  bun-cache:
  sccache-cache:
