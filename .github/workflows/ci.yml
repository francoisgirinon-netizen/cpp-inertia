name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-env
      - name: Configure, build and test (dev)
        run: |
          scripts/dev sh -c 'status=0; cmake --workflow --preset dev || status=$?; sccache --show-stats; exit "$status"'

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-env
      - name: Configure, build and test (asan, ubsan)
        run: |
          scripts/dev sh -c 'status=0; cmake --workflow --preset asan || status=$?; sccache --show-stats; exit "$status"'

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-env
      - name: Configure, build and test (coverage)
        run: |
          scripts/dev sh -c 'status=0; cmake --workflow --preset coverage || status=$?; sccache --show-stats; exit "$status"'
      - name: Report and enforce the minimum line coverage
        run: scripts/dev tools/coverage-report.sh
      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: build/coverage/html
          if-no-files-found: error

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dev-env
      - name: Configure the dev tree with the examples (compile database for clang-tidy)
        run: scripts/dev cmake --preset dev -DINERTIA_BUILD_EXAMPLES=ON -DINERTIA_IWYU=ON
      - name: Rewrite the compile database for the runner
        run: python3 tools/host-compile-commands.py
      - name: Build with include-what-you-use (no tests)
        run: scripts/dev sh -c 'status=0; cmake --build --preset dev || status=$?; sccache --show-stats; exit "$status"'
      - name: Install pre-commit
        run: pipx install pre-commit==4.7.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run every hook on the whole tree
        run: pre-commit run --all-files --show-diff-on-failure

  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pre-commit
        run: pipx install pre-commit==4.7.0
      - name: Check every commit message of the range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "${BASE//0/}" ]; then
            # new branch: no previous tip, check the commits that main does not have
            range="origin/main..$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          status=0
          for sha in $(git rev-list --reverse "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            pre-commit run conventional-pre-commit --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/message" || status=1
            echo "::endgroup::"
          done
          exit "$status"
