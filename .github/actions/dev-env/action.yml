name: Dev environment
description: Build the cpp-inertia-dev image (BuildKit GitHub cache) and persist the vcpkg binary cache

runs:
  using: composite
  steps:
    - name: Read the runner user
      id: user
      shell: bash
      run: |
        echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
        echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the dev image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/Dockerfile
        build-args: |
          UID=${{ steps.user.outputs.uid }}
          GID=${{ steps.user.outputs.gid }}
        tags: cpp-inertia-dev:latest
        load: true
        cache-from: type=gha,scope=dev-image
        cache-to: type=gha,scope=dev-image,mode=max
    - name: Prepare the vcpkg binary cache directory
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/vcpkg-cache"
        echo "VCPKG_CACHE_DIR=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-${{ github.job }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
        restore-keys: |
          vcpkg-${{ github.job }}-
