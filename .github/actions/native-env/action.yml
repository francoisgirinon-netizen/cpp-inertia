name: Native environment
description: vcpkg at the manifest baseline with a persisted binary cache, CMake and Ninja, optionally sccache (macOS and Windows runners, no Docker)

inputs:
  key:
    description: Distinguishes the vcpkg binary cache of the jobs of a matrix
    required: true
  sccache:
    description: Compile through sccache (the GitHub cache backend). Not for the Visual Studio generator, which ignores compiler launchers
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The runners ship a vcpkg of their own, but the manifest's builtin-baseline must be reachable in
    # its git history. Like docker/Dockerfile, check out exactly that commit (read from vcpkg.json).
    - name: Check out vcpkg at the manifest baseline
      shell: bash
      run: |
        baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
        test -n "$baseline"
        root="$RUNNER_TEMP/vcpkg"
        git init -q "$root"
        git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
        git -C "$root" fetch -q --depth 1 origin "$baseline"
        git -C "$root" checkout -q FETCH_HEAD
        if [ "$RUNNER_OS" = Windows ]; then
          (cd "$root" && cmd.exe //c "bootstrap-vcpkg.bat -disableMetrics")
          echo "VCPKG_ROOT=$(cygpath -m "$root")" >> "$GITHUB_ENV"
        else
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
        fi
    - name: Prepare the vcpkg binary cache directory
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/vcpkg-archives"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-archives" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-archives
        key: vcpkg-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ inputs.key }}-
    # CMake and Ninja at the versions of mise.toml (the presets need CMake 3.31 or newer).
    - uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
      with:
        cmakeVersion: 4.4.4
        ninjaVersion: 1.13.2
    # Exports ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN for sccache's GitHub cache backend. The
    # launcher variables only initialise the cache variables of a first configure (CMake 3.17+),
    # which is how the presets, that name no launcher on native builds, pick it up.
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      if: ${{ inputs.sccache == 'true' }}
    - name: Compile through sccache
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
        } >> "$GITHUB_ENV"
    # Ports built from source (openssl, c-ares, ...) need the autotools on macOS.
    - name: Install the build tools the vcpkg ports need
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: brew install autoconf automake libtool
